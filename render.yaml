services:
  - type: web
    name: controle-de-container
    runtime: node
    region: oregon # mesma região do Supabase (aws us-west-2): menor latência app ↔ banco
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # v3.0 (multi-tenant): senha do usuário de banco restrito "ccs_app" (RLS). Gerar no painel do
      # Render (valor aleatório, 16+ caracteres). O build cria/atualiza o usuário; o sistema conecta com ele.
      - key: APP_DB_ROLE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      # E-mail "Esqueci minha senha" (Brevo, chave de API v3 xkeysib-…).
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        value: aslog.ccs@gmail.com
      - key: EMAIL_REMETENTE_NOME
        value: CCS – Container Control Solutions
      # SMS de rastreamento (mesma BREVO_API_KEY; créditos de SMS no Brevo).
      - key: SMS_REMETENTE
        value: CCS
      # Primeiro administrador: criado na subida só se o banco não tiver usuários.
      # Depois do primeiro login, troque a senha pela tela e remova estas variáveis.
      - key: ADMIN_INICIAL_EMAIL
        sync: false
      - key: ADMIN_INICIAL_NOME
        sync: false
      - key: ADMIN_INICIAL_SENHA
        sync: false
